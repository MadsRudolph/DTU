<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D1220">
<link rel="manifest" href="/manifest.json">
<title>Loop Pad</title>
<style>
:root{--bg:#0D1220;--panel:#151C2E;--line:#2A3450;--ink:#E4E9F1;--sub:#8E9BAE;--amber:#F0A03C;--cyan:#4FC4D4;--ok:#57C79A;--bad:#E87070}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;display:flex;flex-direction:column;touch-action:none}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:16px}header b span{color:var(--amber)}
#title{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font:15px system-ui}
button,.tool{background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 13px;font:600 14px system-ui;cursor:pointer}
button:active{transform:scale(.96)}
.tool.on{border-color:var(--amber);color:var(--amber)}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.on{border-color:#fff;transform:scale(1.12)}
.thick{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0}
.thick span{display:block;border-radius:50%;background:var(--ink)}
.thick.on{border-color:var(--amber)}
.thick.on span{background:var(--amber)}
#wrap{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#status{position:fixed;bottom:10px;left:12px;font:600 12px monospace;color:var(--sub);background:rgba(13,18,32,.85);padding:4px 10px;border-radius:8px;max-width:75vw;z-index:5}
#zoomHud{position:fixed;bottom:10px;right:12px;display:flex;gap:6px;z-index:5}
#zoomHud button{padding:8px 13px;font-size:15px}
#fb{position:fixed;top:64px;right:0;width:min(340px,85vw);max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;padding:12px 14px;transform:translateX(105%);transition:transform .25s;z-index:6}
#fb.show{transform:none}
#fb h3{font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.fbe{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.fbe .v{font-weight:700}
.fbe .v.correct{color:var(--ok)}.fbe .v.partly{color:var(--amber)}.fbe .v.wrong{color:var(--bad)}
.fbe ul{padding-left:18px;color:var(--sub)}
#fbBtn{position:fixed;top:64px;right:10px;z-index:7}
#fbBtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:6px;visibility:hidden}
#fbBtn.new .dot{visibility:visible}
a.course{color:var(--cyan);text-decoration:none;font-weight:700;padding:9px 6px}
#qbanner{display:none;padding:9px 14px;background:rgba(240,160,60,.10);border-bottom:1px solid var(--amber);font-size:14.5px;line-height:1.45}
#qbanner.show{display:flex;gap:10px;align-items:flex-start}
#qbanner .qtag{flex-shrink:0;font:700 11px monospace;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:2px 7px;margin-top:2px}
#qbanner .qx{margin-left:auto;flex-shrink:0;background:none;border:none;color:var(--sub);font-size:16px;padding:2px 6px}
#qpick{display:none;position:fixed;inset:0;z-index:20;background:rgba(13,18,32,.92)}
#qpick.show{display:flex;align-items:center;justify-content:center}
#qpick .box{width:min(680px,92vw);max-height:82vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
#qpick h3{margin-bottom:10px}
#qpats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#qpats button.on{border-color:var(--amber);color:var(--amber)}
#qlist{overflow:auto;display:flex;flex-direction:column;gap:6px}
#qlist button{text-align:left;font-weight:400;font-size:14px;line-height:1.4}
#qlist button b{color:var(--amber);font-size:11px;margin-right:6px}
#qlist button.attempted{opacity:.55}
</style>
</head>
<body>
<header>
  <b>Loop<span>Pad</span></b>
  <input id="title" placeholder="what are you deriving?">
  <button class="swatch on" data-c="#111a28" style="background:#111a28"></button>
  <button class="swatch" data-c="#C96F14" style="background:#C96F14"></button>
  <button class="swatch" data-c="#177E8C" style="background:#177E8C"></button>
  <button class="swatch" data-c="#B23B3B" style="background:#B23B3B"></button>
  <button class="thick" data-w="1.3" title="thin"><span style="width:6px;height:6px"></span></button>
  <button class="thick on" data-w="2.2" title="medium"><span style="width:10px;height:10px"></span></button>
  <button class="thick" data-w="4.2" title="thick"><span style="width:16px;height:16px"></span></button>
  <button id="eraseArea" class="tool" title="rubs ink out under the tip — the grid stays">◌ Eraser</button>
  <button id="eraseStroke" class="tool" title="tap any stroke to remove the whole stroke">✂ Stroke</button>
  <button id="penOnly" class="tool on" title="pen draws · one finger pans · pinch zooms">S-Pen only</button>
  <button id="undo">↩ Undo</button>
  <button id="clear">✕ New board</button>
  <button id="save" style="border-color:var(--amber);color:var(--amber)">💾 Save → Claude</button>
  <button id="qBtn">❓ Question</button>
  <a class="course" href="/course">📘 Course</a>
</header>
<div id="qbanner"><span class="qtag" id="qtag"></span><span id="qtext"></span><button class="qx" id="qClear" title="work freely">✕</button></div>
<div id="qpick"><div class="box">
  <h3>Pick a question to derive</h3>
  <div id="qpats"></div>
  <div id="qlist"></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button id="qRandom" style="border-color:var(--amber);color:var(--amber)">🎲 Random from filter</button>
    <button id="qCancel" style="margin-left:auto">Cancel</button>
  </div>
</div></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg"><g id="annoView"><g id="annoMap"></g></g></svg>
</div>
<div id="zoomHud">
  <button id="zOut">−</button>
  <button id="zFit" title="fit the whole drawing">⌂</button>
  <button id="zIn">+</button>
</div>
<button id="fbBtn">💬 Feedback<span class="dot"></span></button>
<div id="fb"><h3 style="display:flex;align-items:center">Claude's review<button id="fbClose" style="margin-left:auto;background:none;border:none;color:var(--sub);font-size:18px;padding:2px 8px;cursor:pointer">✕</button></h3><div id="fbList">Nothing yet — save a board, then ask Claude to check it.</div></div>
<div id="status">ready</div>

<script>
"use strict";
// ============ infinite world canvas ============
// STROKES live in WORLD coordinates; the view is pan+zoom over them.
// Pen draws · one finger pans (in S-Pen-only mode) · pinch zooms · wheel zooms.
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var overlay=document.getElementById("overlay"),wrap=document.getElementById("wrap");
var annoView=document.getElementById("annoView"),annoMap=document.getElementById("annoMap");
var statusEl=document.getElementById("status");
var dpr=window.devicePixelRatio||1;
var view={x:0,y:0,z:1}; // world -> screen: s = w*z + pan
var color="#111a28",tool="pen",penOnly=true,penSize=2.2;
var STROKES=[]; // {mode:"pen"|"erase", color, pts:[[wx,wy,w],...]}
var dirty=true;
var lastMoveT=0; // hold-to-straighten: when the pen last MOVED (not just wobbled)

function resize(){
  cv.width=wrap.clientWidth*dpr; cv.height=wrap.clientHeight*dpr;
  cv.style.width=wrap.clientWidth+"px"; cv.style.height=wrap.clientHeight+"px";
  overlay.setAttribute("viewBox","0 0 "+wrap.clientWidth+" "+wrap.clientHeight);
  dirty=true;
}
window.addEventListener("resize",resize);

function worldOf(cx,cy){ return [(cx-view.x)/view.z,(cy-view.y)/view.z]; }
function drawSeg(c,s,a,b,zoomScale){
  c.globalCompositeOperation = s.mode==="erase" ? "destination-out" : "source-over";
  c.strokeStyle = s.mode==="erase" ? "rgba(0,0,0,1)" : s.color;
  c.lineCap="round"; c.lineJoin="round";
  c.lineWidth = (s.mode==="erase" ? 48 : b[2]);
  c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation="source-over";
  // paper + grid (infinite: draw only visible lines, in world space)
  ctx.fillStyle="#F2F4F0"; ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*view.z,0,0,dpr*view.z,dpr*view.x,dpr*view.y);
  var w0=worldOf(0,0),w1=worldOf(wrap.clientWidth,wrap.clientHeight);
  ctx.strokeStyle="rgba(24,34,52,0.08)"; ctx.lineWidth=1/view.z;
  var g=50;
  for(var x=Math.floor(w0[0]/g)*g;x<=w1[0];x+=g){ctx.beginPath();ctx.moveTo(x,w0[1]);ctx.lineTo(x,w1[1]);ctx.stroke();}
  for(var y=Math.floor(w0[1]/g)*g;y<=w1[1];y+=g){ctx.beginPath();ctx.moveTo(w0[0],y);ctx.lineTo(w1[0],y);ctx.stroke();}
  // ink (replay; erase punches through ink but the paper stays because it was
  // painted before the transform block and destination-out only affects what
  // was drawn after… so ink must go to its own pass:)
  // -> render ink into an offscreen pass to keep erase off the paper.
  inkPass();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.drawImage(inkCv,0,0,cv.width/dpr,cv.height/dpr);
  // sync the SVG annotation layer to the same view transform
  annoView.setAttribute("transform","matrix("+view.z+" 0 0 "+view.z+" "+view.x+" "+view.y+")");
}
var inkCv=document.createElement("canvas"),inkCtx=inkCv.getContext("2d");
function inkPass(){
  inkCv.width=cv.width; inkCv.height=cv.height;
  var c=inkCtx;
  c.setTransform(dpr*view.z,0,0,dpr*view.z,dpr*view.x,dpr*view.y);
  STROKES.forEach(function(s){
    for(var i=1;i<s.pts.length;i++) drawSeg(c,s,s.pts[i-1],s.pts[i]);
  });
  c.globalCompositeOperation="source-over";
}
// Hold-to-straighten (GoodNotes-style): pen down, held still ≥450 ms after
// drawing a roughly-line-shaped stroke → snap to a straight segment. Curves
// and loops are left alone (max deviation from the chord must be small).
function maybeStraighten(){
  if(!cur||cur.mode!=="pen"||cur.straight)return;
  if(performance.now()-lastMoveT<450)return;
  var n=cur.pts.length; if(n<6||cur.len*view.z<30)return;
  var a=cur.pts[0],b=cur.pts[n-1];
  var chord=Math.hypot(b[0]-a[0],b[1]-a[1]);
  if(chord<1e-6){lastMoveT=performance.now();return;}
  var maxDev=0;
  for(var i=1;i<n-1;i++){
    var p=cur.pts[i];
    var t=((p[0]-a[0])*(b[0]-a[0])+(p[1]-a[1])*(b[1]-a[1]))/(chord*chord);
    t=Math.max(0,Math.min(1,t));
    maxDev=Math.max(maxDev,Math.hypot(p[0]-(a[0]+t*(b[0]-a[0])),p[1]-(a[1]+t*(b[1]-a[1]))));
  }
  if(maxDev>Math.max(12,chord*0.18)){lastMoveT=performance.now();return;} // not line-like: leave it
  var wsum=0; cur.pts.forEach(function(p){wsum+=p[2]});
  var w=wsum/n;
  cur.pts=[[a[0],a[1],w],[b[0],b[1],w]];
  cur.straight=true;
  statusEl.textContent="📏 straightened — keep holding to adjust the end, lift to finish";
  dirty=true;
}
function tick(){ maybeStraighten(); if(dirty){dirty=false; render();} requestAnimationFrame(tick); }

// ---- input: pen draws, fingers pan/zoom ----
var pointers={},drawingId=null,cur=null,panStart=null,pinchStart=null;
function pt(e){ var r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function segDist(p,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;
  var t=L2?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2)):0;
  return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));
}
function strokeAt(wp){
  for(var i=STROKES.length-1;i>=0;i--){
    var s=STROKES[i]; if(s.mode==="erase")continue;
    for(var j=1;j<s.pts.length;j++) if(segDist(wp,s.pts[j-1],s.pts[j])<26/view.z) return i;
  }
  return -1;
}
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(err){/* synthetic/expired pointer — capture is best-effort */}
  var isPenDevice=e.pointerType==="pen";
  var draws = isPenDevice || (!penOnly && e.pointerType!=="pen");
  pointers[e.pointerId]={p:pt(e),type:e.pointerType,draws:draws};
  var ids=Object.keys(pointers);
  if(draws && ids.filter(function(k){return pointers[k].draws}).length===1 && !pinchStart){
    var wp=worldOf.apply(null,pt(e));
    if(tool==="strokeErase"){ var i=strokeAt(wp); if(i>=0){STROKES.splice(i,1);dirty=true;} drawingId=e.pointerId; return; }
    drawingId=e.pointerId;
    // S-Pen barrel/eraser button (buttons bit 2 = barrel, bit 32 = eraser end)
    // makes this stroke an eraser stroke without touching the toolbar.
    var penBtnErase = e.pointerType==="pen" && (e.buttons & 34);
    cur={mode:(tool==="erase"||penBtnErase)?"erase":"pen",color:color,pts:[[wp[0],wp[1],penSize*1.3]],len:0,straight:false};
    lastMoveT=performance.now();
    STROKES.push(cur);
  } else if(!draws){
    var touches=ids.filter(function(k){return !pointers[k].draws});
    if(touches.length===1){ panStart={p:pt(e),vx:view.x,vy:view.y}; }
    else if(touches.length===2){
      var a=pointers[touches[0]].p,b=pointers[touches[1]].p;
      pinchStart={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:view.z,
                  mid:[(a[0]+b[0])/2,(a[1]+b[1])/2],vx:view.x,vy:view.y};
      panStart=null;
      if(cur){STROKES.pop();cur=null;drawingId=null;dirty=true;} // finger landed mid-stroke in draw mode
    }
  }
});
cv.addEventListener("pointermove",function(e){
  if(!pointers[e.pointerId])return;
  pointers[e.pointerId].p=pt(e);
  if(e.pointerId===drawingId){
    if(tool==="strokeErase"){ var i=strokeAt(worldOf.apply(null,pt(e))); if(i>=0){STROKES.splice(i,1);dirty=true;} return; }
    if(!cur)return;
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    if(!evs.length)evs=[e]; // coalesced list can be EMPTY — [] is truthy, so || alone won't fall back
    evs.forEach(function(ev){
      var wp=worldOf.apply(null,pt(ev));
      // The S-Pen button is often only visible in MOVE events (buttons bit 2 or
      // 32) — pressing/releasing it mid-stroke splits into a new stroke of the
      // other mode, so the button works whenever it's held.
      var wantErase = tool==="erase" || (e.pointerType==="pen" && (ev.buttons & 34));
      if((cur.mode==="erase") !== !!wantErase && tool!=="strokeErase"){
        cur={mode:wantErase?"erase":"pen",color:color,pts:[[wp[0],wp[1],penSize*1.3]],len:0,straight:false};
        lastMoveT=performance.now();
        STROKES.push(cur);
        return;
      }
      var prev=cur.pts[cur.pts.length-1];
      var dScreen=Math.hypot(wp[0]-prev[0],wp[1]-prev[1])*view.z;
      if(cur.straight){
        // already snapped: keep holding and move to rubber-band the endpoint
        cur.pts[1]=[wp[0],wp[1],cur.pts[1][2]];
        if(dScreen>2.5)lastMoveT=performance.now();
        return;
      }
      if(dScreen>2.5)lastMoveT=performance.now(); // real movement, not pen wobble
      var pressure=ev.pressure&&ev.pressure>0?ev.pressure:0.5;
      cur.len+=Math.hypot(wp[0]-prev[0],wp[1]-prev[1]);
      cur.pts.push([wp[0],wp[1],penSize*(0.85+pressure*1.7)]);
    });
    dirty=true;
    return;
  }
  var touches=Object.keys(pointers).filter(function(k){return !pointers[k].draws});
  if(pinchStart&&touches.length>=2){
    var a=pointers[touches[0]].p,b=pointers[touches[1]].p;
    var d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    var mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    var nz=Math.max(0.15,Math.min(5,pinchStart.z*d/pinchStart.d));
    // keep the pinch midpoint anchored in world space
    var wmid=[(pinchStart.mid[0]-pinchStart.vx)/pinchStart.z,(pinchStart.mid[1]-pinchStart.vy)/pinchStart.z];
    view.z=nz; view.x=mid[0]-wmid[0]*nz; view.y=mid[1]-wmid[1]*nz;
    dirty=true;
  } else if(panStart&&touches.length===1){
    var p=pointers[touches[0]].p;
    view.x=panStart.vx+(p[0]-panStart.p[0]);
    view.y=panStart.vy+(p[1]-panStart.p[1]);
    dirty=true;
  }
});
function lift(e){
  delete pointers[e.pointerId];
  if(e.pointerId===drawingId){drawingId=null;cur=null;}
  var touches=Object.keys(pointers).filter(function(k){return !pointers[k].draws});
  if(touches.length<2)pinchStart=null;
  if(touches.length===1){var p=pointers[touches[0]].p;panStart={p:p,vx:view.x,vy:view.y};}
  else panStart=null;
}
cv.addEventListener("pointerup",lift); cv.addEventListener("pointercancel",lift);
// The pen button can fire a context menu, which swallows the stroke — never allow it.
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  var f=e.deltaY<0?1.15:1/1.15;
  var nz=Math.max(0.15,Math.min(5,view.z*f));
  var p=pt(e),w=worldOf(p[0],p[1]);
  view.z=nz; view.x=p[0]-w[0]*nz; view.y=p[1]-w[1]*nz; dirty=true;
},{passive:false});

// ---- zoom HUD ----
function zoomBy(f){
  var cxp=[wrap.clientWidth/2,wrap.clientHeight/2],w=worldOf(cxp[0],cxp[1]);
  var nz=Math.max(0.15,Math.min(5,view.z*f));
  view.z=nz; view.x=cxp[0]-w[0]*nz; view.y=cxp[1]-w[1]*nz; dirty=true;
}
document.getElementById("zIn").addEventListener("click",function(){zoomBy(1.25)});
document.getElementById("zOut").addEventListener("click",function(){zoomBy(1/1.25)});
function contentBBox(){
  var xs=[],ys=[];
  STROKES.forEach(function(s){ if(s.mode==="erase")return;
    s.pts.forEach(function(p){xs.push(p[0]);ys.push(p[1]);}); });
  if(!xs.length)return null;
  var m=80;
  var x0=Math.min.apply(null,xs)-m,y0=Math.min.apply(null,ys)-m;
  return {x:x0,y:y0,w:Math.max.apply(null,xs)+m-x0,h:Math.max.apply(null,ys)+m-y0};
}
document.getElementById("zFit").addEventListener("click",function(){
  var b=contentBBox(); if(!b){view={x:0,y:0,z:1};dirty=true;return;}
  var z=Math.max(0.15,Math.min(5,Math.min(wrap.clientWidth/b.w,wrap.clientHeight/b.h)));
  view.z=z; view.x=(wrap.clientWidth-b.w*z)/2-b.x*z; view.y=(wrap.clientHeight-b.h*z)/2-b.y*z; dirty=true;
});

// ---- tools ----
function setTool(t){
  tool=t;
  document.getElementById("eraseArea").classList.toggle("on",t==="erase");
  document.getElementById("eraseStroke").classList.toggle("on",t==="strokeErase");
}
document.querySelectorAll(".swatch").forEach(function(s){
  s.addEventListener("click",function(){
    document.querySelectorAll(".swatch").forEach(function(x){x.classList.remove("on")});
    s.classList.add("on"); color=s.getAttribute("data-c"); setTool("pen");
  });
});
document.querySelectorAll(".thick").forEach(function(t){
  t.addEventListener("click",function(){
    document.querySelectorAll(".thick").forEach(function(x){x.classList.remove("on")});
    t.classList.add("on"); penSize=parseFloat(t.getAttribute("data-w")); setTool("pen");
  });
});
document.getElementById("eraseArea").addEventListener("click",function(){ setTool(tool==="erase"?"pen":"erase"); });
document.getElementById("eraseStroke").addEventListener("click",function(){ setTool(tool==="strokeErase"?"pen":"strokeErase"); });
document.getElementById("penOnly").addEventListener("click",function(){
  penOnly=!penOnly; this.classList.toggle("on",penOnly);
});
document.getElementById("undo").addEventListener("click",function(){ STROKES.pop(); dirty=true; });
document.getElementById("clear").addEventListener("click",function(){
  STROKES=[]; annoMap.innerHTML=""; document.getElementById("title").value="";
  view={x:0,y:0,z:1}; dirty=true; statusEl.textContent="new board";
});

// ---- question bank ----
var QUESTIONS=[],currentQ=null,qFilter="All";
var attempted={};try{attempted=JSON.parse(localStorage.getItem("lp-attempted"))||{}}catch(e){}
fetch("/api/questions").then(function(r){return r.json()}).then(function(qs){
  QUESTIONS=qs; buildPicker();
}).catch(function(){});
function buildPicker(){
  var pats=["All","P1","P2","P3","P4","P5","P6","P7"];
  var pw=document.getElementById("qpats"); pw.innerHTML="";
  pats.forEach(function(p){
    var b=document.createElement("button"); b.textContent=p;
    if(p===qFilter)b.classList.add("on");
    b.addEventListener("click",function(){ qFilter=p; buildPicker(); });
    pw.appendChild(b);
  });
  var lw=document.getElementById("qlist"); lw.innerHTML="";
  QUESTIONS.filter(function(q){return qFilter==="All"||q.pattern===qFilter})
    .forEach(function(q){
      var b=document.createElement("button");
      if(attempted[q.id])b.classList.add("attempted");
      b.innerHTML="<b>"+q.pattern+" · "+q.kind+(attempted[q.id]?" · done":"")+"</b>"+q.prompt;
      b.addEventListener("click",function(){ pickQ(q); });
      lw.appendChild(b);
    });
}
function pickQ(q){
  currentQ=q;
  document.getElementById("qtag").textContent=q.pattern+" · "+q.kind;
  document.getElementById("qtext").textContent=q.prompt;
  document.getElementById("qbanner").classList.add("show");
  document.getElementById("qpick").classList.remove("show");
  document.getElementById("title").value=q.id;
  resize();
  statusEl.textContent="derive it on the board, then Save";
}
document.getElementById("qBtn").addEventListener("click",function(){
  document.getElementById("qpick").classList.add("show"); buildPicker();
});
document.getElementById("qCancel").addEventListener("click",function(){
  document.getElementById("qpick").classList.remove("show");
});
document.getElementById("qRandom").addEventListener("click",function(){
  var pool=QUESTIONS.filter(function(q){return (qFilter==="All"||q.pattern===qFilter)&&!attempted[q.id]});
  if(!pool.length)pool=QUESTIONS.filter(function(q){return qFilter==="All"||q.pattern===qFilter});
  if(pool.length)pickQ(pool[Math.floor(Math.random()*pool.length)]);
});
document.getElementById("qClear").addEventListener("click",function(){
  currentQ=null; document.getElementById("qbanner").classList.remove("show"); resize();
});

// ---- save: export the WHOLE drawing (auto-cropped), map feedback back ----
var exportMaps={};try{exportMaps=JSON.parse(localStorage.getItem("lp-export-maps"))||{}}catch(e){}
function exportPNG(){
  var b=contentBBox();
  if(!b){ b={x:-wrap.clientWidth/2,y:-wrap.clientHeight/2,w:wrap.clientWidth,h:wrap.clientHeight}; }
  var maxDim=Math.max(b.w,b.h);
  var s=Math.max(0.4,Math.min(3,2400/maxDim)); // target ~2400px longest side
  var t=document.createElement("canvas");
  t.width=Math.round(b.w*s); t.height=Math.round(b.h*s);
  var c=t.getContext("2d");
  c.fillStyle="#F2F4F0"; c.fillRect(0,0,t.width,t.height);
  c.setTransform(s,0,0,s,-b.x*s,-b.y*s);
  c.strokeStyle="rgba(24,34,52,0.08)"; c.lineWidth=1/s;
  var g=50;
  for(var x=Math.floor(b.x/g)*g;x<=b.x+b.w;x+=g){c.beginPath();c.moveTo(x,b.y);c.lineTo(x,b.y+b.h);c.stroke();}
  for(var y=Math.floor(b.y/g)*g;y<=b.y+b.h;y+=g){c.beginPath();c.moveTo(b.x,y);c.lineTo(b.x+b.w,y);c.stroke();}
  // ink with erase compositing on a separate layer so holes don't kill the paper
  var il=document.createElement("canvas"); il.width=t.width; il.height=t.height;
  var ic=il.getContext("2d");
  ic.setTransform(s,0,0,s,-b.x*s,-b.y*s);
  STROKES.forEach(function(st){ for(var i=1;i<st.pts.length;i++) drawSeg(ic,st,st.pts[i-1],st.pts[i]); });
  c.setTransform(1,0,0,1,0,0);
  c.globalCompositeOperation="source-over";
  c.drawImage(il,0,0);
  return {png:t.toDataURL("image/png"),bbox:b,scale:s};
}
document.getElementById("save").addEventListener("click",function(){
  var title=document.getElementById("title").value.trim()||"untitled";
  statusEl.textContent="saving…";
  if(currentQ){ attempted[currentQ.id]=true;
    try{localStorage.setItem("lp-attempted",JSON.stringify(attempted))}catch(e){} }
  var ex=exportPNG();
  fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:title,id:Date.now().toString(36),
      qid:currentQ?currentQ.id:"",prompt:currentQ?currentQ.prompt:"",
      png:ex.png,strokes:STROKES.length})})
  .then(function(r){return r.json()})
  .then(function(j){
    if(j.ok){
      exportMaps[j.file]={x:ex.bbox.x,y:ex.bbox.y,s:ex.scale};
      try{localStorage.setItem("lp-export-maps",JSON.stringify(exportMaps))}catch(e){}
      statusEl.textContent="✓ saved "+j.file+" — now ask Claude: \"check my board\"";
    } else statusEl.textContent="save failed: "+j.error;
  })
  .catch(function(e){ statusEl.textContent="save failed — server offline? "+e; });
});

// ---- feedback polling (annotations mapped from export-image px to world) ----
var seen=0;
var fb=document.getElementById("fb"),fbBtn=document.getElementById("fbBtn");
fbBtn.addEventListener("click",function(){ fb.classList.toggle("show"); fbBtn.classList.remove("new"); });
document.getElementById("fbClose").addEventListener("click",function(){ fb.classList.remove("show"); });
function poll(){
  fetch("/api/feedback").then(function(r){return r.json()}).then(function(list){
    if(!Array.isArray(list))return;
    var el=document.getElementById("fbList");
    if(list.length){
      el.innerHTML="";
      list.slice().reverse().forEach(function(f){
        var d=document.createElement("div");d.className="fbe";
        d.innerHTML="<div class='v "+(f.verdict||"")+"'>"+(f.verdict||"note").toUpperCase()+" · "+(f.board||"")+"</div>"+
          "<ul>"+(f.notes||[]).map(function(n){return "<li>"+n+"</li>"}).join("")+"</ul>";
        el.appendChild(d);
      });
      var newest=list[list.length-1];
      if(list.length>seen){
        if(seen>0)fbBtn.classList.add("new");
        seen=list.length;
        var m=exportMaps[newest.board];
        annoMap.innerHTML=newest.svg||"";
        annoMap.setAttribute("transform", m ?
          "translate("+m.x+" "+m.y+") scale("+(1/m.s)+")" : "");
        dirty=true;
      }
    }
  }).catch(function(){});
}
setInterval(poll,5000);

// ---- PWA ----
function pwaDiag(extra){
  if(window.matchMedia("(display-mode: standalone)").matches){ statusEl.textContent="📱 running as installed app"; return; }
  if(!window.isSecureContext){ statusEl.textContent="⚠ PWA blocked: not a secure context"; return; }
  statusEl.textContent="secure ✓ · "+(extra||"");
}
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredPrompt=e;
  pwaDiag("installable ✓ — tap ⬇ Install");
  var b=document.createElement("button");
  b.id="installBtn"; b.textContent="⬇ Install"; b.style.borderColor="var(--ok)"; b.style.color="var(--ok)";
  b.addEventListener("click",function(){ if(deferredPrompt){deferredPrompt.prompt(); deferredPrompt=null; b.remove();} });
  document.querySelector("header").appendChild(b);
});
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(function(){}); }

resize(); tick(); poll();
</script>
