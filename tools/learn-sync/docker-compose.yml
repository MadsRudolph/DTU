services:
  learn-sync:
    build: .
    image: learn-sync:latest
    env_file: .env
    environment:
      LEARN_REPO: /repo
      LEARN_STORAGE_STATE: /session/storageState.json
      LEARN_STATUS: /status/status.json
    volumes:
      # The clone of github.com/MadsRudolph/DTU that this service publishes into.
      - /srv/learn-sync/repo:/repo
      # Browser session, kept outside the image so a rebuild does not sign you out.
      - /srv/learn-sync/session:/session
      # Status JSON for the Glance dashboard, served by nginx on :8099.
      - /srv/learn-sync/status:/status
      # The deploy key is only ever read.
      - /srv/learn-sync/ssh:/root/.ssh:ro
      # NOT read-only: Google Drive access tokens expire hourly and rclone writes
      # the refreshed token back into rclone.conf. Mounted :ro, every transfer
      # fails with "Failed to save config ... read-only file system" -- and
      # upload.py reports success anyway, so the failure is silent.
      - /srv/learn-sync/rclone:/root/.config/rclone
    working_dir: /repo
