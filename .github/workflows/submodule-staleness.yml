name: Submodule Staleness Check

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch: # Manual trigger

jobs:
  check-submodules:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check submodule staleness
        id: check
        run: |
          stale=""
          while IFS= read -r line; do
            # Extract path from .gitmodules
            path=$(echo "$line" | awk '{print $2}')
            [ -z "$path" ] && continue

            cd "$path" 2>/dev/null || continue

            # Get the commit this repo pins
            pinned=$(git rev-parse HEAD)
            pinned_date=$(git log -1 --format=%ci HEAD)

            # Fetch remote and check if behind
            git fetch origin 2>/dev/null
            default_branch=$(git remote show origin 2>/dev/null | grep 'HEAD branch' | awk '{print $NF}')
            [ -z "$default_branch" ] && default_branch="main"

            remote_head=$(git rev-parse "origin/$default_branch" 2>/dev/null)

            if [ -n "$remote_head" ] && [ "$pinned" != "$remote_head" ]; then
              behind=$(git rev-list --count "$pinned".."origin/$default_branch" 2>/dev/null || echo "?")
              remote_date=$(git log -1 --format=%ci "origin/$default_branch")
              stale="${stale}| \`${path}\` | ${behind} | ${pinned_date%% *} | ${remote_date%% *} |\n"
            fi

            cd "$GITHUB_WORKSPACE"
          done < <(git submodule status | sed 's/^[+ -]*//' )

          if [ -n "$stale" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<ENDOFBODY"
              echo "## 📦 Stale Submodules Detected"
              echo ""
              echo "The following submodules are behind their remote:"
              echo ""
              echo "| Submodule | Commits Behind | Pinned Date | Remote Date |"
              echo "|-----------|---------------|-------------|-------------|"
              echo -e "$stale"
              echo ""
              echo "### How to update"
              echo "\`\`\`bash"
              echo "git submodule update --remote <path>"
              echo "git add <path>"
              echo "git commit -m \"Update submodule <path>\""
              echo "\`\`\`"
              echo "ENDOFBODY"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update issue
        if: steps.check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '📦 Stale submodules detected';
            const body = `${{ steps.check.outputs.body }}`;

            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'submodule-staleness',
            });

            if (existing.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['submodule-staleness'],
              });
            }

      - name: Close issue if all up to date
        if: steps.check.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'submodule-staleness',
            });

            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
