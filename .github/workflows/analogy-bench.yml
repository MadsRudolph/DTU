# Fallback deploy of the Analogy Bench (study.madsrudolph.dev) on push.
# Normal path is `npm run deploy:cf` from a PC with a Wrangler login; this workflow
# covers the case where the note was written on a PC that is not logged in.
# It only does anything once the repo secret CLOUDFLARE_API_TOKEN exists
# (Cloudflare dashboard → My Profile → API Tokens → "Edit Cloudflare Workers" template).
name: analogy-bench
on:
  push:
    branches: [main]
    paths:
      - "5. Semester/Electroacoustics/Analogy Bench/**"
      - ".github/workflows/analogy-bench.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret — skipping deploy (deploy locally with npm run deploy:cf)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
      - name: Build
        if: steps.token.outputs.present == 'true'
        working-directory: 5. Semester/Electroacoustics/Analogy Bench
        run: python3 build.py
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 5. Semester/Electroacoustics/Analogy Bench
          command: deploy
